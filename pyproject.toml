[project]
name = "bql-label-printer"
version = "0.1.0"
description = "Web UI for label design - printing handled by separate services"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "n"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1.2",
    "MarkupSafe>=2.1.3",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.9.1",
    "pytest>=7.4.2",
    "flake8>=6.1.0",
]

[tool.uv]
dev-dependencies = [
    "black>=23.9.1",
    "pytest>=7.4.2",
    "flake8>=6.1.0",
]
package = false
